name: Main Scene
root:
  name: Root Actor
  components:
    - __type__: loki::physics::PhysicsWorldComponent
      worldParams:
        gravity: { x: 0, y: 10 }
        pixelsToMetersRatio: 20
        velocityIterationCount: 8
        positionIterationCount: 3
  children:
    - name: Clearing
      components:
        - __type__: loki::tiles::TileMapDataComponent
          tileMapData: data/tilemaps/clearing.tilemap.yml
        - __type__: loki::graphics::GraphicsTileMapComponent
        - __type__: loki::physics::PhysicsTileMapComponent
          bodyParams:
            type: Kinematic
            linearDamping: 0
            angularDamping: 0
            gravityScale: 1
            fixedRotation: true
            isBullet: false
    - name: Ditto
      transform:
        Origin: { x: 11, y: 11 }
        Position: { x: 100, y: 100 }
        Rotation: 0
        Scale: { x: 1, y: 1 }
      components:
        - __type__: loki::graphics::SpriteComponent
          spriteData: data/sprites/ditto/ditto.sprite.yml
        - __type__: loki::physics::PhysicsBodyComponent
          bodyParams:
            type: Dynamic
            linearDamping: 0
            angularDamping: 0
            gravityScale: 1
            fixedRotation: true
            isBullet: false
          shapeParams:
            - __type__: loki::physics::CircleShapeParams
              material:
                friction: 0.2
                restitution: 0
              density: 100
              isSensor: false
              radius: 0.5
        - __type__: loki::testbed::CharacterControllerComponent